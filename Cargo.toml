[package]
name = "web-starter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["macros"] }
bytesize = "2.1.0"
config = "0.15.18"
num_cpus = "1.17.0"
# sea-orm = { version = "1.1.17", features = ["runtime-tokio-native-tls", "sqlx-postgres"] }
sea-orm = { version = "1.1.17", features = [
    "with-chrono",
    "debug-print",
    "with-rust_decimal",
    "macros",
    "runtime-tokio-rustls",
    # "runtime-tokio-native-tls",
    "sqlx-postgres",
] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = [
    "trace",
    "timeout",
    "limit",
    "cors",
    "normalize-path",
] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["chrono", "env-filter"] }
xid = "1.1.1"
